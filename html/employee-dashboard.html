<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stackly Partner Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/employee-dashboard.css" />
</head>
<body>
<div class="dashboard-root">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-logo-slot">
          <img id="brand-logo-img" src="../assets/Logo.webp" alt="" class="brand-logo-img"
               onerror="this.onerror=null;this.style.display='none';document.getElementById('brand-logo-fallback').style.display='flex';document.getElementById('brand-wordmark').style.display='block';">
          
        </span>
      </div>
      <button class="close-btn" id="close-sidebar-btn" aria-label="Close sidebar">✕</button>
    </div>
    <div class="sidebar-section-label">Main menu</div>
    <nav class="sidebar-nav" id="nav-main"></nav>
    <div class="sidebar-section-label">Management</div>
    <nav class="sidebar-nav" id="nav-management"></nav>

    <div class="sidebar-user" id="sidebar-user">
      <div class="sidebar-user-avatar" id="sidebar-user-avatar">–</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebar-user-name">Signed out</div>
        <div class="sidebar-user-email" id="sidebar-user-email">—</div>
      </div>
    </div>
    <button class="logout-full-btn" id="logout-btn">Logout</button>
  </aside>
  <main class="main-content">
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
        <div class="page-title">
          <h1 id="page-title-text">Dashboard</h1>
          <p id="page-sub-text"></p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <span class="search-icon"><i data-lucide="search"></i></span>
          <input placeholder="Search clients, programs, specialists…">
        </div>
        <button class="icon-btn" id="notif-btn" aria-label="Notifications"><i data-lucide="bell"></i><span class="notif-dot"></span></button>

        <div class="topbar-user" id="topbar-user">
          <button class="topbar-user-btn" id="topbar-user-btn">
            <span class="topbar-user-avatar" id="topbar-user-avatar">–</span>
            <span class="topbar-user-name" id="topbar-user-name">Signed out</span>
            <span class="topbar-user-caret">▾</span>
          </button>
          <div class="topbar-user-menu" id="topbar-user-menu">
            <div class="topbar-user-menu-email">
              <div class="label">Email</div>
              <div class="value" id="topbar-user-email">—</div>
            </div>
            <button class="topbar-user-menu-item" data-nav="settings"><i data-lucide="settings"></i> Settings</button>
            <button class="topbar-user-menu-item danger" id="topbar-logout-btn"><i data-lucide="log-out"></i> Logout</button>
          </div>
        </div>
      </div>
    </header>
    <div class="content-area" id="content-area"></div>
  </main>
</div>
<script src="../js/employee-dashboard.js"></script>
</body>
</html>
