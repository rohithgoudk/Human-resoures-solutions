<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Position Not Found</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/404.css">
</head>
<body>

<div class="bg-fixed"></div>
<canvas id="orgchart-canvas"></canvas>
<div class="grain"></div>

<main class="hero">
  <div class="card" id="card">
    <div class="badge"><i class="fa-solid fa-id-badge"></i> Employee Directory</div>
    <h1 class="error-code">404</h1>
    <h2 class="error-title">This position isn't on the org chart.</h2>
    <p class="error-desc">
      The page you're looking for may have been <strong>restructured</strong>,
      <strong>reassigned</strong>, or was simply never hired. Let's route you
      back to a role that still exists.
    </p>
    <div class="action-group">
      <a href="index.html" class="btn-primary">
        <i class="fa-solid fa-building"></i> Back to Home
      </a>
      <button onclick="history.back()" class="btn-outline">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </button>
    </div>
  </div>
</main>

<script src="../js/404.js"></script>

</body>
</html>
